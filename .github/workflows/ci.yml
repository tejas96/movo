name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: movo
          POSTGRES_PASSWORD: movo
          POSTGRES_DB: movo_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U movo -d movo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Turbo's local cache: unchanged packages skip build and typecheck. One entry per commit,
      # restored from the newest one with the same lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm lint
      # Every en key is used by the app or the API, and every key the code asks for exists.
      - name: i18n keys
        run: pnpm --filter @movo/i18n check-keys
      - name: Generate Prisma client
        run: pnpm --filter @movo/api db:generate
        env:
          DATABASE_URL: postgresql://movo:movo@localhost:5433/movo_test
      # typecheck dependsOn ^build, so this also builds (or restores) contracts and i18n dist,
      # which the test steps below import.
      - run: pnpm typecheck
      - name: Migrate test database
        run: pnpm --filter @movo/api db:deploy
        env:
          DATABASE_URL: postgresql://movo:movo@localhost:5433/movo_test
      - name: Library tests
        run: pnpm --filter @movo/contracts --filter @movo/i18n test
      - name: API tests
        run: pnpm --filter @movo/api test
      - name: Design preview builds
        run: pnpm design:preview

  api-image:
    name: API image builds and starts
    # The Dockerfile otherwise only runs in Deploy, after merge. This builds the same image,
    # starts it on an empty database (so migrations run inside it) and checks /health.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: movo
          POSTGRES_PASSWORD: movo
          POSTGRES_DB: movo_image
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U movo -d movo_image"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: movo-api:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api-amd64
      - name: Start it and check /health
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://movo:movo@localhost:5433/movo_image \
            -e JWT_SECRET="$(openssl rand -hex 32)" movo-api:ci
          for i in $(seq 1 45); do
            if body=$(curl -fsS http://localhost:4000/health 2>/dev/null); then
              echo "$body"
              echo "$body" | grep -q "\"version\":\"$GITHUB_SHA\"" && exit 0
              echo "::error::/health does not report this commit"; exit 1
            fi
            sleep 2
          done
          docker logs api
          exit 1

  changes:
    name: Changed paths
    # Decides whether the 45-minute Android build is needed. Plain git, no third-party action.
    # Any doubt (no base commit, git error) means "yes, build it".
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR checks out its merge commit: parent 1 is the base it merges into.
          fetch-depth: 2
      - id: diff
        name: Did the app, packages or lockfile change?
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          mobile=true
          if [ "$EVENT" = "pull_request" ]; then
            base=$(git rev-parse HEAD^1 2>/dev/null || true)
          else
            base=""
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] &&
              git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then
              base=$BEFORE
            fi
          fi
          if [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD); then
            echo "$files"
            if echo "$files" | grep -qE '^(apps/mobile/|packages/|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$|\.github/actions/setup/)'; then
              mobile=true
            else
              mobile=false
            fi
          fi
          echo "mobile=$mobile" | tee -a "$GITHUB_OUTPUT"

  android:
    name: Android release build
    # A release build runs checks a debug build skips (R8, resource verification, the HTTPS
    # API_URL guard). Debug-signed here, arm64 only to keep it fast; the Play build is
    # .github/workflows/release-android.yml.
    # Runs only when the app could have changed. A skipped job counts as passed for a required
    # check; if the changes job itself fails, it runs anyway instead of skipping.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build shared libraries
        run: pnpm --filter @movo/contracts --filter @movo/i18n build
      - name: Release env
        run: echo "API_URL=${{ vars.MOVO_API_URL || 'https://movo-society.duckdns.org' }}" > apps/mobile/.env.production
      - name: assembleRelease
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
