name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: movo
          POSTGRES_PASSWORD: movo
          POSTGRES_DB: movo_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U movo -d movo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Build shared libraries
        run: pnpm --filter @movo/contracts --filter @movo/i18n build
      - name: Generate Prisma client
        run: pnpm --filter @movo/api db:generate
        env:
          DATABASE_URL: postgresql://movo:movo@localhost:5433/movo_test
      - run: pnpm typecheck
      - name: Migrate test database
        run: pnpm --filter @movo/api db:deploy
        env:
          DATABASE_URL: postgresql://movo:movo@localhost:5433/movo_test
      - name: Library tests
        run: pnpm --filter @movo/contracts --filter @movo/i18n test
      - name: API tests
        run: pnpm --filter @movo/api test
      - name: Design preview builds
        run: pnpm design:preview

  api-image:
    name: API image builds and starts
    # The Dockerfile otherwise only runs in Deploy, after merge. This builds the same image,
    # starts it on an empty database (so migrations run inside it) and checks /health.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: movo
          POSTGRES_PASSWORD: movo
          POSTGRES_DB: movo_image
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U movo -d movo_image"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: movo-api:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api-amd64
      - name: Start it and check /health
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://movo:movo@localhost:5433/movo_image \
            -e JWT_SECRET="$(openssl rand -hex 32)" movo-api:ci
          for i in $(seq 1 45); do
            if body=$(curl -fsS http://localhost:4000/health 2>/dev/null); then
              echo "$body"
              echo "$body" | grep -q "\"version\":\"$GITHUB_SHA\"" && exit 0
              echo "::error::/health does not report this commit"; exit 1
            fi
            sleep 2
          done
          docker logs api
          exit 1

  android:
    name: Android release build
    # A release build runs checks a debug build skips (R8, resource verification, the HTTPS
    # API_URL guard). Debug-signed here, arm64 only to keep it fast; the Play build is
    # .github/workflows/release-android.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: pnpm install --frozen-lockfile
      - name: Build shared libraries
        run: pnpm --filter @movo/contracts --filter @movo/i18n build
      - name: Release env
        run: echo "API_URL=${{ vars.MOVO_API_URL || 'https://movo-society.duckdns.org' }}" > apps/mobile/.env.production
      - name: assembleRelease
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
