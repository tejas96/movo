name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: movo
          POSTGRES_PASSWORD: movo
          POSTGRES_DB: movo_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U movo -d movo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Build shared libraries
        run: pnpm --filter @movo/contracts --filter @movo/i18n build
      - name: Generate Prisma client
        run: pnpm --filter @movo/api db:generate
        env:
          DATABASE_URL: postgresql://movo:movo@localhost:5433/movo_test
      - run: pnpm typecheck
      - name: Migrate test database
        run: pnpm --filter @movo/api db:deploy
        env:
          DATABASE_URL: postgresql://movo:movo@localhost:5433/movo_test
      - name: Library tests
        run: pnpm --filter @movo/contracts --filter @movo/i18n test
      - name: API tests
        run: pnpm --filter @movo/api test
      - name: Design preview builds
        run: pnpm design:preview

  api-image:
    name: API image builds and starts
    # The Dockerfile otherwise only runs in Deploy, after merge. This builds the same image,
    # starts it on an empty database (so migrations run inside it) and checks /health.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: movo
          POSTGRES_PASSWORD: movo
          POSTGRES_DB: movo_image
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U movo -d movo_image"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: movo-api:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api-amd64
      - name: Start it and check /health
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://movo:movo@localhost:5433/movo_image \
            -e JWT_SECRET="$(openssl rand -hex 32)" movo-api:ci
          for i in $(seq 1 45); do
            if body=$(curl -fsS http://localhost:4000/health 2>/dev/null); then
              echo "$body"
              echo "$body" | grep -q "\"version\":\"$GITHUB_SHA\"" && exit 0
              echo "::error::/health does not report this commit"; exit 1
            fi
            sleep 2
          done
          docker logs api
          exit 1

  android:
    name: Android release build
    # A release build runs checks a debug build skips (R8, resource verification, the HTTPS
    # API_URL guard). Debug-signed here, arm64 only to keep it fast; the Play build is
    # .github/workflows/release-android.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: pnpm install --frozen-lockfile
      - name: Build shared libraries
        run: pnpm --filter @movo/contracts --filter @movo/i18n build
      - name: Release env
        run: echo "API_URL=${{ vars.MOVO_API_URL || 'https://movo-society.duckdns.org' }}" > apps/mobile/.env.production
      - name: assembleRelease
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
