name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: movo
          POSTGRES_PASSWORD: movo
          POSTGRES_DB: movo_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U movo -d movo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Build shared libraries
        run: pnpm --filter @movo/contracts --filter @movo/i18n build
      - name: Generate Prisma client
        run: pnpm --filter @movo/api db:generate
        env:
          DATABASE_URL: postgresql://movo:movo@localhost:5433/movo_test
      - run: pnpm typecheck
      - name: Migrate test database
        run: pnpm --filter @movo/api db:deploy
        env:
          DATABASE_URL: postgresql://movo:movo@localhost:5433/movo_test
      - name: Library tests
        run: pnpm --filter @movo/contracts --filter @movo/i18n test
      - name: API tests
        run: pnpm --filter @movo/api test
      - name: Design preview builds
        run: pnpm design:preview
