name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: movo
          POSTGRES_PASSWORD: movo
          POSTGRES_DB: movo_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U movo -d movo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Build shared libraries
        run: pnpm --filter @movo/contracts --filter @movo/i18n build
      - name: Generate Prisma client
        run: pnpm --filter @movo/api db:generate
        env:
          DATABASE_URL: postgresql://movo:movo@localhost:5433/movo_test
      - run: pnpm typecheck
      - name: Migrate test database
        run: pnpm --filter @movo/api db:deploy
        env:
          DATABASE_URL: postgresql://movo:movo@localhost:5433/movo_test
      - name: Library tests
        run: pnpm --filter @movo/contracts --filter @movo/i18n test
      - name: API tests
        run: pnpm --filter @movo/api test
      - name: Design preview builds
        run: pnpm design:preview

  android:
    name: Android release build
    # A release build runs checks a debug build skips (R8, resource verification, the HTTPS
    # API_URL guard). Debug-signed here, arm64 only to keep it fast; the Play build is
    # .github/workflows/release-android.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile
      - name: Build shared libraries
        run: pnpm --filter @movo/contracts --filter @movo/i18n build
      - name: Release env
        run: echo "API_URL=${{ vars.MOVO_API_URL || 'https://movo-society.duckdns.org' }}" > apps/mobile/.env.production
      - name: assembleRelease
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
