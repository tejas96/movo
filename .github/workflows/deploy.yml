name: Deploy

# Builds the API image, pushes it to GHCR, then updates the VM over SSH: copies the compose
# files, pulls, takes a backup, runs migrations with the new image while the old API still
# serves, swaps the API, and waits for it to be healthy. If it is not, it goes back to the
# previous image. Runs after CI passes
# on main, or by hand. Until the DEPLOY_* secrets exist every job is skipped, so this workflow
# never fails on a repo that has no server yet. Runbook: docs/08-release-and-ops.md.
#
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key, no passphrase),
#          DEPLOY_KNOWN_HOSTS (ssh-keyscan output; the pinned host key)
# Optional: DEPLOY_PORT,
#           GHCR_PULL_TOKEN (read:packages; default is this run's own token, so the GHCR
#           package can stay private)
# Optional variables: DEPLOY_PATH (default /opt/movo)
#                     DEPLOY_ARCHES (default "arm64": the Oracle Ampere A1 VM. Set "amd64" for an
#                     x86_64 VM such as E2.1.Micro, or "amd64 arm64" while moving between them)
#                     ARM_RUNNER (default ubuntu-24.04-arm, free for public repos; set it to
#                     ubuntu-latest on a private repo and arm64 is built under QEMU, slower)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/movo-api

jobs:
  gate:
    name: Check deploy settings
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      sha: ${{ steps.check.outputs.sha }}
      arches: ${{ steps.check.outputs.arches }}
    steps:
      - id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ARCHES: ${{ vars.DEPLOY_ARCHES || 'arm64' }}
        run: |
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          # Only arch names here: an output that contains a secret's value (DEPLOY_USER is
          # often "ubuntu", like the runner labels) is masked and dropped by Actions.
          for a in $ARCHES; do
            case "$a" in amd64|arm64) ;; *) echo "::error::DEPLOY_ARCHES: unknown arch $a"; exit 1 ;; esac
          done
          echo "arches=$(printf '%s\n' $ARCHES | jq -Rsc 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY are not all set."
          fi

  build:
    name: Build image (${{ matrix.arch }})
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.gate.outputs.arches) }}
    runs-on: ${{ matrix.arch == 'arm64' && (vars.ARM_RUNNER || 'ubuntu-24.04-arm') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      # Only needed when arm64 is built on an x86 runner (ARM_RUNNER=ubuntu-latest).
      - if: matrix.arch == 'arm64' && runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,scope=api-${{ matrix.arch }},mode=max
          build-args: GIT_SHA=${{ needs.gate.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Publish multi-arch tag
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest (sha and latest)
        working-directory: /tmp/digests
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "$IMAGE:$SHA" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$SHA"

  deploy:
    name: Update the VM
    needs: [gate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/movo' }}
      SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          sparse-checkout: infra
      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_KNOWN_HOSTS is not set. Add the ssh-keyscan output of the VM as that secret."
            exit 1
          fi
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host movo\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PORT" > ~/.ssh/config
      - name: Copy compose files
        run: |
          # shellcheck disable=SC2029
          ssh movo "mkdir -p '$DEPLOY_PATH/backup'"
          scp infra/docker-compose.prod.yml infra/Caddyfile "movo:$DEPLOY_PATH/"
          scp infra/backup/Dockerfile infra/backup/*.sh "movo:$DEPLOY_PATH/backup/"
      - name: Pull and restart
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
          OWNER: ${{ github.actor }}
        run: |
          # Values go over stdin, not the command line, so the token never shows in `ps` on the VM.
          {
            printf 'DEPLOY_PATH=%q\nAPI_IMAGE=%q\nOWNER=%q\nGHCR_PULL_TOKEN=%q\n' \
              "$DEPLOY_PATH" "$IMAGE:$SHA" "$OWNER" "$GHCR_PULL_TOKEN"
            cat <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          export API_IMAGE
          echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          test -f .env.prod || { echo ".env.prod is missing in $PWD"; exit 1; }
          dc() { docker compose -f docker-compose.prod.yml --env-file .env.prod "$@"; }
          # Remember the running tag so a later manual `up` uses the same image.
          set_image() {
            if grep -q '^API_IMAGE=' .env.prod; then
              sed -i "s#^API_IMAGE=.*#API_IMAGE=$1#" .env.prod
            else
              echo "API_IMAGE=$1" >> .env.prod
            fi
          }
          wait_healthy() {
            for i in $(seq 1 60); do
              s=$(docker inspect -f '{{.State.Health.Status}}' "$(dc ps -q api)")
              if [ "$s" = healthy ]; then return 0; fi
              sleep 5
            done
            return 1
          }
          PREV_IMAGE=$(sed -n 's/^API_IMAGE=//p' .env.prod)
          set_image "$API_IMAGE"
          dc pull api caddy postgres
          dc build backup
          dc up -d postgres backup
          # 1. A fresh backup, so a bad migration loses nothing (backups/predeploy, newest 5).
          # </dev/null on every docker command: this script reaches bash over stdin, and a
          # command that reads stdin would swallow the rest of the script.
          dc exec -T backup backup.sh predeploy </dev/null
          # 2. Migrations with the new image while the old API still serves. If they fail, the
          #    old API keeps running and the deploy stops here.
          if ! dc run --rm --no-deps -T -e MIGRATE_ONLY=1 api </dev/null; then
            [ -n "$PREV_IMAGE" ] && set_image "$PREV_IMAGE"
            echo "::error::migrations failed; the old API is still running"
            exit 1
          fi
          # 3. Swap the API.
          dc up -d --remove-orphans
          if wait_healthy; then
            echo "api healthy on $API_IMAGE"
          else
            dc logs --tail 80 api
            if [ -n "$PREV_IMAGE" ] && [ "$PREV_IMAGE" != "$API_IMAGE" ]; then
              echo "::error::new API is not healthy; going back to $PREV_IMAGE"
              set_image "$PREV_IMAGE"
              dc up -d api
              wait_healthy && echo "back on $PREV_IMAGE" || echo "::error::previous image is not healthy either"
            fi
            exit 1
          fi
          running=$(docker inspect -f '{{.Config.Image}}' "$(dc ps -q api)")
          if [ "$running" != "$API_IMAGE" ]; then
            echo "::error::api runs $running, expected $API_IMAGE"
            exit 1
          fi
          docker image prune -f
          echo "MOVO-DEPLOY-DONE $API_IMAGE"
          REMOTE
          } | ssh movo bash -s | tee /tmp/deploy.log
          # The script ends with a marker. Without it, the script stopped early (for example a
          # command swallowed its stdin) even if ssh exited 0.
          grep -q "^MOVO-DEPLOY-DONE $IMAGE:$SHA\$" /tmp/deploy.log || {
            echo "::error::the deploy script did not finish on the VM"
            exit 1
          }
