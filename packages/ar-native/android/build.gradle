apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

def safeExt(String name, Object fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace "com.movo.ar"
  compileSdk safeExt("compileSdkVersion", 35)

  defaultConfig {
    minSdk safeExt("minSdkVersion", 24)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  // ARCore. "optional" in the manifest: phones without ARCore still install the app and get the 2D map.
  implementation "com.google.ar:core:1.45.0"
}
