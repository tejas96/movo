<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MOVO Money</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--ink:#2B2A2E;--muted:#706F76;--accent:#F06A2E;--red:#D63B3B}
body{margin:0}
a{color:#2B2A2E}a:hover{color:#2B2A2E}
.scroll::-webkit-scrollbar{display:none}
.glass{background:rgba(255,255,255,.5);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1.5px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 10px 30px rgba(70,40,70,.06)}
.rim{padding:5px;background:rgba(255,255,255,.75);box-shadow:0 10px 30px rgba(70,40,70,.08)}
.art{position:relative;overflow:hidden}
.art::before{content:"";position:absolute;inset:-35%;background:var(--g);filter:blur(26px);animation:flow 14s ease-in-out infinite alternate}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 15%,rgba(255,255,255,.8) 100%)}
.art > *{position:relative;z-index:1}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.95);font-family:Poppins,sans-serif;font-size:14px;font-weight:500;color:#2B2A2E;cursor:pointer;transition:background .2s}
@keyframes flow{0%{transform:translate(0,0) rotate(0) scale(1)}100%{transform:translate(-8%,6%) rotate(10deg) scale(1.15)}}
@keyframes aur1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-30px) scale(1.15)}}
@keyframes aur2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-20px)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes coin{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-10px) rotate(10deg)}}
@keyframes coin2{0%,100%{transform:translateY(0) rotate(12deg)}50%{transform:translateY(-6px) rotate(-6deg)}}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
.bar{transform-origin:bottom;transform:scaleY(0);animation:grow .9s cubic-bezier(.2,1.1,.4,1) forwards}
.barx{transform-origin:left;transform:scaleX(0);animation:growx 1.1s cubic-bezier(.2,.9,.3,1) .3s forwards}
.press{transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.press:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}.rise{opacity:1}.bar,.barx{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEEDEC; font-family: Poppins, sans-serif; color: var(--ink);">
  <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none;">
    <div style="position: absolute; width: 360px; height: 300px; border-radius: 50%; background: #F8CDB0; filter: blur(80px); opacity: .75; bottom: -90px; left: -120px; animation: aur1 16s ease-in-out infinite;"></div>
    <div style="position: absolute; width: 340px; height: 300px; border-radius: 50%; background: #F4B3C2; filter: blur(80px); opacity: .7; bottom: -110px; right: -120px; animation: aur2 18s ease-in-out infinite;"></div>
  </div>

  <div class="scroll" style="position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; padding: 58px 18px 130px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
    <div class="rise" style="display: flex; align-items: center; gap: 12px;">
      <h1 style="margin: 0; flex-grow: 1; font-weight: 600; font-size: 26px; letter-spacing: -0.4px;">Money</h1>
      <div role="group" aria-label="Show" style="display: flex; gap: 6px;">
        <button class="chip press" onClick="{{showMine}}" aria-pressed="{{minePressed}}" style="background: {{mineBg}};">My dues</button>
        <button class="chip press" onClick="{{showSociety}}" aria-pressed="{{socPressed}}" style="background: {{socBg}};">Society</button>
      </div>
    </div>

    <sc-if value="{{mine}}" hint-placeholder-val="{{yes}}">
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div class="rim rise" style="border-radius: 34px; animation-delay: .08s;">
          <div class="art" style="border-radius: 29px; --g: radial-gradient(at 25% 30%, #F59A4A, transparent 50%), radial-gradient(at 75% 25%, #F5A3C7, transparent 50%), radial-gradient(at 55% 75%, #F6D35B, transparent 55%), #F4E2DA; padding: 20px; box-sizing: border-box;">
            <svg width="70" height="70" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; top: 18px; right: 26px; animation: coin 3s ease-in-out infinite;"><circle cx="12" cy="12" r="10" fill="#F6D35B"></circle><circle cx="12" cy="12" r="7" fill="none" stroke="#B5501F" stroke-width=".8" stroke-dasharray="2 2"></circle><text x="12" y="15.5" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="9" fill="#8A3E14">₹</text></svg>
            <svg width="38" height="38" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; top: 70px; right: 90px; animation: coin2 2.6s ease-in-out .4s infinite;"><circle cx="12" cy="12" r="10" fill="#FBE29A"></circle><circle cx="12" cy="12" r="7" fill="none" stroke="#B5501F" stroke-width=".8" stroke-dasharray="2 2"></circle></svg>
            <div style="font-size: 13px; color: #4D4C52;">Total due · Flat B-102</div>
            <div style="margin-top: 60px; font-weight: 500; font-size: 46px; line-height: 1; letter-spacing: -1.2px;">₹{{amount}}</div>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
              <span style="font-size: 12px; background: rgba(255,255,255,.85); border-radius: 999px; padding: 5px 11px; display: flex; align-items: center; gap: 6px;"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent);"></span>Due 31 Oct</span>
              <span style="font-size: 12px; background: rgba(255,255,255,.85); border-radius: 999px; padding: 5px 11px;">2 bills</span>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 16px;">
              <a href="#" class="press" style="flex-grow: 1; height: 54px; border-radius: 999px; background: #2B2A2E; color: #FFFFFF; text-decoration: none; font-weight: 500; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 22px;">Pay by UPI
                <span style="width: 42px; height: 42px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F06A2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg></span>
              </a>
              <a href="#" class="press" style="height: 54px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center;">How to pay</a>
            </div>
          </div>
        </div>

        <div class="glass rise" style="border-radius: 28px; padding: 8px; animation-delay: .16s;">
          <div style="padding: 10px 12px 6px; font-size: 12px; letter-spacing: .6px; color: var(--muted);">OPEN BILLS</div>
          <a href="#" class="press" style="text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 22px;">
            <span class="art" aria-hidden="true" style="width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; --g: radial-gradient(at 30% 30%, #F7B48A, transparent 55%), radial-gradient(at 70% 70%, #F6D35B, transparent 55%), #F3E7DE;"></span>
            <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-weight: 500; font-size: 15px;">October maintenance</span><span style="font-size: 12px; color: var(--muted);">Due 31 Oct</span></span>
            <span style="font-weight: 500; font-size: 16px;">₹2,000</span>
          </a>
          <a href="#" class="press" style="text-decoration: none; display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 22px;">
            <span class="art" aria-hidden="true" style="width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; --g: radial-gradient(at 30% 30%, #8FA8E0, transparent 55%), radial-gradient(at 70% 70%, #CDB2F0, transparent 55%), #E3DCEB;"></span>
            <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-weight: 500; font-size: 15px;">Sinking fund</span><span style="font-size: 12px; color: var(--muted);">Due 31 Oct</span></span>
            <span style="font-weight: 500; font-size: 16px;">₹400</span>
          </a>
        </div>

        <div class="glass rise" style="border-radius: 28px; padding: 18px; animation-delay: .24s;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-weight: 500; font-size: 16px;">What you paid</span>
            <span style="font-size: 12px; color: var(--muted);">Last 6 months</span>
          </div>
          <div style="display: flex; align-items: flex-end; gap: 10px; height: 130px; margin-top: 16px;">
            <sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
              <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end;">
                <div class="bar" style="width: 100%; height: {{b.h}}; border-radius: 999px; background: {{b.bg}}; animation-delay: {{b.delay}};"></div>
                <span style="font-size: 11px; color: {{b.fg}}; font-weight: {{b.fw}};">{{b.m}}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{society}}" hint-placeholder-val="{{no}}">
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div class="glass rise" style="border-radius: 30px; padding: 22px;">
          <div style="font-size: 13px; color: var(--muted);">Collected this month</div>
          <div style="font-weight: 500; font-size: 40px; line-height: 1.15; letter-spacing: -1px; margin-top: 4px;">₹1,84,000</div>
          <div style="height: 12px; border-radius: 999px; background: rgba(255,255,255,.8); margin-top: 16px; overflow: hidden;">
            <div class="barx" style="height: 100%; width: 68%; border-radius: 999px; background: linear-gradient(90deg, #F5A3C7, #F06A2E);"></div>
          </div>
          <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px;"><span style="color: var(--muted);">46 of 68 flats paid</span><span style="font-weight: 600;">68%</span></div>
        </div>
        <div class="rise" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; animation-delay: .1s;">
          <div class="glass" style="border-radius: 24px; padding: 16px;"><div style="font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px;"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--accent);"></span>Due</div><div style="font-weight: 500; font-size: 26px;">18 flats</div></div>
          <div class="glass" style="border-radius: 24px; padding: 16px;"><div style="font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px;"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--red);"></span>Overdue</div><div style="font-weight: 500; font-size: 26px;">4 flats</div></div>
        </div>
      </div>
    </sc-if>
  </div>

  <nav aria-label="Main" class="glass" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 4px; padding: 7px; border-radius: 999px; background: rgba(255,255,255,.72);">
    <a href="Main.dc.html" aria-label="Home" class="press" style="width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2B2A2E" stroke-width="1.7" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg></a>
    <a href="Notices.dc.html" aria-label="Notices" class="press" style="width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2B2A2E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l6 4V6L7 10z"></path><path d="M17 9a4 4 0 010 6"></path></svg></a>
    <a href="Money.dc.html" aria-label="Money" aria-current="page" class="press" style="height: 50px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; font-weight: 600; box-shadow: 0 4px 12px rgba(70,40,70,.08);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F06A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18M16 15h2"></path></svg>Money</a>
    <a href="Members.dc.html" aria-label="Members" class="press" style="width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2B2A2E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><path d="M16 4.5a3.5 3.5 0 010 7M21 20c0-2.6-1.6-4.8-4-5.6"></path></svg></a>
    <a href="Me.dc.html" aria-label="Me" class="press" style="width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2B2A2E" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'mine', n: 0 };
  }
  componentDidMount() {
    var self = this, start = null;
    var step = function (t) {
      if (start === null) start = t + 400;
      var p = Math.max(0, Math.min(1, (t - start) / 1200));
      self.setState({ n: Math.round(2400 * (1 - Math.pow(1 - p, 3))) });
      if (p < 1) self.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }
  componentWillUnmount() {
    if (this.raf) cancelAnimationFrame(this.raf);
  }
  renderVals() {
    var self = this;
    var mine = this.state.tab === 'mine';
    var data = [['May', 100], ['Jun', 100], ['Jul', 100], ['Aug', 120], ['Sep', 100], ['Oct', 30]];
    var bars = data.map(function (d, i) {
      var now = i === data.length - 1;
      return { m: d[0], h: d[1] + 'px', bg: now ? '#F06A2E' : 'linear-gradient(180deg, #F5A3C7, #F8CDB0)', fg: now ? '#2B2A2E' : '#706F76', fw: now ? '600' : '400', delay: (0.4 + i * 0.08) + 's' };
    });
    return {
      yes: true, no: false,
      mine: mine, society: !mine,
      minePressed: mine ? 'true' : 'false', socPressed: mine ? 'false' : 'true',
      mineBg: mine ? '#FFFFFF' : 'rgba(255,255,255,.3)',
      socBg: mine ? 'rgba(255,255,255,.3)' : '#FFFFFF',
      amount: this.state.n.toLocaleString('en-IN'),
      bars: bars,
      showMine: function () { self.setState({ tab: 'mine' }); },
      showSociety: function () { self.setState({ tab: 'society' }); }
    };
  }
}
</script>
</body>
</html>
