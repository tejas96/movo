<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MOVO Me</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--ink:#2B2A2E;--muted:#706F76;--accent:#F06A2E;--red:#D63B3B}
body{margin:0}
a{color:#2B2A2E}a:hover{color:#2B2A2E}
.scroll::-webkit-scrollbar{display:none}
.glass{background:rgba(255,255,255,.5);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1.5px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 10px 30px rgba(70,40,70,.06)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(43,42,46,.12) 1px,transparent 1.3px);background-size:9px 9px;-webkit-mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 70%);mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 70%);pointer-events:none}
.avatar{border-radius:50%;background:radial-gradient(circle at 34% 28%,#FFF3EC 0%,#FBB59D 18%,#F0735A 50%,#D9465A 80%,#B8457A 100%);box-shadow:0 16px 34px rgba(217,70,90,.3),inset -8px -10px 20px rgba(120,20,60,.2),inset 6px 8px 14px rgba(255,255,255,.45)}
.knob{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.track{transition:background .25s}
.item{transition:background .2s}
.item:hover{background:rgba(255,255,255,.6)}
@keyframes aur1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-30px) scale(1.15)}}
@keyframes aur2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-20px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes ripple{0%{transform:scale(1);opacity:.3}100%{transform:scale(1.7);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
.press{transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.press:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}.rise{opacity:1}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEEDEC; font-family: Poppins, sans-serif; color: var(--ink);">
  <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none;">
    <div style="position: absolute; width: 360px; height: 300px; border-radius: 50%; background: #F4B3C2; filter: blur(80px); opacity: .7; bottom: -90px; left: -120px; animation: aur1 16s ease-in-out infinite;"></div>
    <div style="position: absolute; width: 340px; height: 300px; border-radius: 50%; background: #CDB2F0; filter: blur(80px); opacity: .75; bottom: -110px; right: -120px; animation: aur2 18s ease-in-out infinite;"></div>
  </div>

  <div class="scroll" style="position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; padding: 58px 18px 130px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
    <div class="glass rise" style="position: relative; overflow: hidden; border-radius: 32px; padding: 26px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
      <span class="dots" aria-hidden="true"></span>
      <div style="position: relative; width: 92px; height: 92px;">
        <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; background: #F0735A; animation: ripple 3.2s ease-out infinite;"></span>
        <span class="avatar" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 600; font-size: 28px; animation: breathe 4.5s ease-in-out infinite;">PN</span>
      </div>
      <div style="position: relative; font-size: 24px; font-weight: 400; letter-spacing: -0.3px;">Hello <strong style="font-weight: 600;">Priya</strong></div>
      <div style="position: relative; font-size: 13px; color: var(--muted);">Flat B-102 <span style="opacity: .4;">|</span> Owner <span style="opacity: .4;">|</span> Laxmi-Pushp</div>
      <a href="#" class="press" style="position: relative; height: 42px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(70,40,70,.06);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F06A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
        Edit profile
      </a>
    </div>

    <div class="rise" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; animation-delay: .08s;">
      <div class="glass" style="border-radius: 24px; padding: 14px;"><div style="font-weight: 500; font-size: 22px;">120</div><div style="font-size: 12px; color: var(--muted);">Points</div></div>
      <div class="glass" style="border-radius: 24px; padding: 14px;"><div style="font-weight: 500; font-size: 22px;">2</div><div style="font-size: 12px; color: var(--muted);">Vehicles</div></div>
      <div class="glass" style="border-radius: 24px; padding: 14px;"><div style="font-weight: 500; font-size: 22px;">3</div><div style="font-size: 12px; color: var(--muted);">Duties</div></div>
    </div>

    <div class="glass rise" style="border-radius: 30px; padding: 8px; animation-delay: .14s;">
      <div style="padding: 12px 14px 4px; font-size: 12px; letter-spacing: .6px; color: var(--muted);">GENERAL</div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <a href="#" class="item" style="text-decoration: none; display: flex; align-items: center; gap: 14px; padding: 0 14px; min-height: 54px; border-radius: 20px;">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2B2A2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
          <span style="flex-grow: 1; font-size: 15px;">{{r.label}}</span>
        </a>
      </sc-for>
      <div style="display: flex; align-items: center; gap: 14px; padding: 0 14px; min-height: 54px;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2B2A2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"></path></svg>
        <span style="flex-grow: 1; font-size: 15px;">Show my number</span>
        <button onClick="{{toggle}}" role="switch" aria-checked="{{onAria}}" aria-label="Show my number to members" class="track" style="position: relative; width: 50px; height: 30px; border: none; border-radius: 999px; cursor: pointer; background: {{trackBg}}; padding: 0;">
          <span class="knob" style="position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.15); transform: translateX({{knobX}});"></span>
        </button>
      </div>
    </div>

    <div class="glass rise" style="border-radius: 30px; padding: 8px; animation-delay: .2s;">
      <div style="padding: 12px 14px 4px; font-size: 12px; letter-spacing: .6px; color: var(--muted);">OTHERS</div>
      <a href="#" class="item" style="text-decoration: none; display: flex; align-items: center; gap: 14px; padding: 0 14px; min-height: 54px; border-radius: 20px;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2B2A2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg>
        <span style="font-size: 15px;">Rewards</span>
      </a>
      <a href="#" class="item" style="text-decoration: none; display: flex; align-items: center; gap: 14px; padding: 0 14px; min-height: 54px; border-radius: 20px;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2B2A2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 9a2.5 2.5 0 115 0c0 1.5-2.5 2-2.5 3.5M12 16.5v.5M12 3a9 9 0 110 18 9 9 0 010-18"></path></svg>
        <span style="font-size: 15px;">Help and support</span>
      </a>
      <a href="Login.dc.html" class="item" style="text-decoration: none; display: flex; align-items: center; gap: 14px; padding: 0 14px; min-height: 54px; border-radius: 20px;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#D63B3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 17l-5-5 5-5M5 12h11"></path></svg>
        <span style="font-size: 15px; color: #B52E2E;">Sign out</span>
      </a>
    </div>
    <div style="text-align: center; font-size: 12px; color: var(--muted);">Movo · Version 1.0</div>
  </div>

  <nav aria-label="Main" class="glass" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 4px; padding: 7px; border-radius: 999px; background: rgba(255,255,255,.72);">
    <a href="Main.dc.html" aria-label="Home" class="press" style="width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2B2A2E" stroke-width="1.7" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg></a>
    <a href="Notices.dc.html" aria-label="Notices" class="press" style="width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2B2A2E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l6 4V6L7 10z"></path><path d="M17 9a4 4 0 010 6"></path></svg></a>
    <a href="Money.dc.html" aria-label="Money" class="press" style="width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2B2A2E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18M16 15h2"></path></svg></a>
    <a href="Members.dc.html" aria-label="Members" class="press" style="width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2B2A2E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><path d="M16 4.5a3.5 3.5 0 010 7M21 20c0-2.6-1.6-4.8-4-5.6"></path></svg></a>
    <a href="Me.dc.html" aria-label="Me" aria-current="page" class="press" style="height: 50px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; font-weight: 600; box-shadow: 0 4px 12px rgba(70,40,70,.08);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F06A2E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>Me</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: true };
  }
  renderVals() {
    var self = this;
    var on = this.state.on;
    var rows = [
      { label: 'My societies and flats', icon: 'M4 11l8-6 8 6v8a1 1 0 01-1 1H5a1 1 0 01-1-1z' },
      { label: 'Notifications', icon: 'M6 16V11a6 6 0 1112 0v5l1.5 2h-15zM10 20.5a2 2 0 004 0' },
      { label: 'Language', icon: 'M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18M12 3a9 9 0 110 18 9 9 0 010-18' },
      { label: 'Change password', icon: 'M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 017 0v3' }
    ];
    return {
      rows: rows,
      onAria: on ? 'true' : 'false',
      trackBg: on ? '#F06A2E' : 'rgba(43,42,46,.18)',
      knobX: on ? '20px' : '0px',
      toggle: function () { self.setState({ on: !self.state.on }); }
    };
  }
}
</script>
</body>
</html>
