# Production stack for one VM: api + postgres + caddy (HTTPS) + backup.
# On the VM, from /opt/movo:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Every variable is listed in .env.prod.example. See docs/08-release-and-ops.md.
name: movo

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-movo}
      TZ: Asia/Kolkata
    # No ports: only the api and backup containers reach it, over the compose network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    image: ${API_IMAGE:-ghcr.io/tejas96/movo-api:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      # POSTGRES_PASSWORD must be URL-safe (openssl rand -hex 24).
      DATABASE_URL: postgresql://${POSTGRES_USER:-movo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-movo}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      APP_BASE_URL: ${APP_BASE_URL:-movo://}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-MOVO <no-reply@example.com>}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIN_SUPPORTED_APP_VERSION: ${MIN_SUPPORTED_APP_VERSION:-0.1.0}
      LATEST_APP_VERSION: ${LATEST_APP_VERSION:-0.1.0}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-https://tejas96.github.io/movo/privacy.html}
      FILES_DIR: /data/files
      TZ: Asia/Kolkata
    volumes:
      # Market photos. Backed up by the backup service as a mirror.
      - files:/data/files
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

  backup:
    build: ./backup
    image: movo-backup:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-movo}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-movo}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      KEEP_DAILY: ${KEEP_DAILY:-14}
      KEEP_MONTHLY: ${KEEP_MONTHLY:-6}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      # rclone reads its remote from env; "r2" here matches RCLONE_REMOTE=r2:<bucket>.
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: ${RCLONE_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${RCLONE_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${RCLONE_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ENDPOINT: ${RCLONE_S3_ENDPOINT:-}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      TZ: Asia/Kolkata
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - files:/files:ro
    logging: *logging

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
